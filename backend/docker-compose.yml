services:
  pocketbase:
    build: .
    container_name: somoim-pocketbase
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./pb_data:/pb/pb_data
      - ./pb_hooks:/pb/pb_hooks
      - ./pb_migrations:/pb/pb_migrations
    environment:
      # backend/.env에서 읽으며 저장된 외부 인증 토큰 등의 암호화에 사용됩니다.
      PB_ENCRYPTION_KEY: ${PB_ENCRYPTION_KEY:?backend/.env에 PB_ENCRYPTION_KEY를 설정하세요}
